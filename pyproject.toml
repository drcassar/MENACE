[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "menace-jogo"
version = "0.1.0"
description = "MENACE: Caixas de fósforo que aprendem (Matchbox Educable Noughts and Crosses Engine)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pygame>=2.0",
    "numpy>=1.21",
    "matplotlib>=3.4",
]

[project.scripts]
menace = "menace_jogo.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["menace_jogo"]

[tool.hatch.build.targets.wheel.force-include]
"menace_jogo/files/assets" = "menace_jogo/files/assets"
